# Auto-merge Dependabot pull requests for minor and patch updates once
# required checks pass. Major updates are left for human review.
#
# Requirements:
# - "Allow auto-merge" enabled in the repository settings
# - a ruleset on master with required status checks, otherwise auto-merge
#   does not wait for CI and merges straight away. The one this expects is
#   committed as .github/rulesets/master.json, in the form github's
#   "Import a ruleset" takes.
#
# Required checks are matched by job name, not by workflow name. The names
# that exist are "Build Image", "Pytest", "Pytest (arm64)",
# "Pytest (arm/v7, emulated)", "Event File", "Test Results", "ShellCheck",
# "Ruff", "Verify Published Image (amd64)" / "(arm64)", "Publish latest" and
# "Image Scan"; "ci", "test", "lint" and "scan" are workflows and never report
# a check of their own, and one workflow can report more than one -- "lint"
# reports both "ShellCheck" and "Ruff".
#
# "Pytest (arm/v7, emulated)" runs on every pull request since #273, and is
# still not in the required list: its verdict comes from an emulator, where a
# QEMU artefact reads like a real failure, so it reports and a person looks
# rather than blocking a merge. Requiring it means adding it to
# .github/rulesets/master.json and importing that.
#
# The two "Verify Published Image" jobs are not candidates either, nor is
# "Publish latest", and for a firmer reason: they check -- and then tag -- the
# image a push to master published, so they never run on a pull request at all.
#
# "Image Scan" is not a candidate for that same firmer reason and one of its
# own. It runs on a schedule against the published image and has no
# pull_request trigger, so it reports no check here at all; and scan.yml's
# header says why letting a vulnerability database decide a pull request would
# be the wrong trade. It matters for auto-merge that it stays that way: these
# pull requests merge themselves once the required checks pass, and a gate
# whose verdict changes overnight for reasons unrelated to the diff would block
# a base image bump on the morning when that bump is the fix.

name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Backstop. Two API calls, and nothing here should ever sit for github's
    # default six hours.
    timeout-minutes: 5
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for minor and patch updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-minor' || steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          # GITHUB_TOKEN works out of the box, but a merge performed with it
          # does not trigger the on:push ci workflow on master, so :latest is
          # not rebuilt until the next push. To get that rebuild, store a PAT
          # as a *Dependabot* secret (Settings > Secrets > Dependabot) and use
          # it here instead.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
