name: ci

on:
  push:
    branches:
      - '**'
    tags:
      - '*'
  pull_request:

# A new push makes the images an in-flight run would produce obsolete, except
# on master where the run publishes latest.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  docker:
    name: "Build Image"
    runs-on: ubuntu-latest
    outputs:
      # What the jobs below pull and what "Publish latest" promotes. A digest
      # rather than a tag: it names this run's image and cannot be moved by
      # another run pushing between the build and the promotion. The repository
      # name is not passed with it -- a job output holding a secret is redacted
      # on the runner -- so each job reads that back for itself.
      digest: ${{ steps.build.outputs.digest }}
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Helper for custom repo name
        id: reponame
        run: |
          if [ "${DOCKER_REPO}" != "" ]; then
            echo "DOCKER_REPO=${DOCKER_REPO}" >> "${GITHUB_OUTPUT}"
          else
            echo "DOCKER_REPO=${{ github.repository }}" >> "${GITHUB_OUTPUT}"
          fi
        env:
          DOCKER_REPO: "${{ secrets.DOCKER_REPO }}"
      -
        name: Docker meta
        id: docker_meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.reponame.outputs.DOCKER_REPO }} # list of Docker images to use as base name for tags
          tags: |
            type=ref,event=branch
            type=semver,pattern={{major}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{version}}
            type=sha
          flavor: |
            latest=false
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        # Dependabot pushes its branch before opening the pull request, and a
        # run it triggers can only read Dependabot secrets, never the Actions
        # secrets below. Logging in would fail, so skip the registry for it and
        # let the build alone prove the bump.
        name: Login to DockerHub
        if: github.event_name != 'pull_request' && github.actor != 'dependabot[bot]'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        # Still master's own step, and still an unconditional push: the
        # dependabot exclusion below belongs to branch pushes, where the run
        # reads Dependabot secrets and cannot log in, and putting it here would
        # leave a master push made by that actor building an image the jobs
        # below then went looking for.
        #
        # What changed is the tags. This used to write the tag users pull,
        # straight out of buildx; now it pushes docker_meta's -- on master the
        # branch name and "sha-<commit>" -- and "Publish latest" below moves
        # latest onto the digest afterwards, once the image has been pulled
        # back and tested. "latest" is not among these tags and is never
        # written here ("latest=false" in the flavor above).
        name: Build and push master
        id: build
        if: github.ref == 'refs/heads/master'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm/v7,linux/arm64/v8
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      -
        name: Build and push branch or test PR
        if: github.ref != 'refs/heads/master'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm/v7,linux/arm64/v8
          push: ${{ github.event_name != 'pull_request' && github.actor != 'dependabot[bot]' }}
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify_published_amd64:
    name: "Verify Published Image (amd64)"
    # The build above is the only thing that puts an image in front of users,
    # and nothing here looked at what came out of it: the suite builds its own
    # image with the local daemon, so a broken manifest, an architecture that
    # builds but does not run, or a registry-side problem would pass every
    # check this repository has. This pulls what was just published, the way a
    # user pulls it, and runs the smoke tests against it.
    #
    # Only where there was a publication to check: the step above pushes latest
    # on master and nowhere else. Nothing is rolled back if this fails -- the
    # tag is already out -- but a red check on master is the difference between
    # knowing and not.
    #
    # Spelled out rather than written as a matrix, and the job below with it,
    # for the reason test.yml gives at the top of that file: the job name is
    # what a required status check and the auto-merge workflow match on. A
    # matrix expands "${{ matrix.arch }}" only in the runs it starts, so on
    # every pull request -- where the "if" below skips the job whole -- the
    # check reported the unexpanded expression as its name.
    needs: docker
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Helper for custom repo name
        id: reponame
        # Repeated rather than taken as an output of the job above: a job output
        # holding a secret is redacted on the runner and never reaches the job
        # that reads it, which would leave this pulling an empty repository name.
        run: |
          if [ "${DOCKER_REPO}" != "" ]; then
            echo "DOCKER_REPO=${DOCKER_REPO}" >> "${GITHUB_OUTPUT}"
          else
            echo "DOCKER_REPO=${{ github.repository }}" >> "${GITHUB_OUTPUT}"
          fi
        env:
          DOCKER_REPO: "${{ secrets.DOCKER_REPO }}"

      - name: Check the published manifest lists every architecture built
        # This job pulls the entry of the manifest list that matches its own
        # runner, and the arm64 one its own, so between them an entry that went
        # missing or came back mislabelled leaves both green while a "docker
        # pull" on the architecture that lost it fails or fetches something
        # else. The list is the only place all three are visible at once, and
        # imagetools reads it straight from the registry, so this costs a
        # request and runs before anything is pulled -- and before latest is
        # made to point at any of it.
        #
        # "linux/arm64", not the "linux/arm64/v8" the build asks for: v8 is
        # arm64's default variant and buildx drops it when it writes the
        # manifest, while arm/v7 keeps its variant because armhf has no
        # default. That is what this build publishes, read off the manifest
        # rather than assumed -- manifests written by other tooling do carry
        # the "/v8". The entries skipped here are the provenance attestations
        # buildx attaches to a pushed build: they carry platform
        # "unknown/unknown" and are not architectures. Keep the list in step
        # with the "platforms:" above.
        env:
          TAG: "${{ steps.reponame.outputs.DOCKER_REPO }}@${{ needs.docker.outputs.digest }}"
        run: |
          expected="linux/amd64 linux/arm/v7 linux/arm64"
          published=$(docker buildx imagetools inspect --raw "${TAG}" |
            jq -r '.manifests[] | select(.platform.os != "unknown") | .platform |
                   .os + "/" + .architecture + (if .variant then "/" + .variant else "" end)' |
            sort | tr '\n' ' ' | sed 's/ $//')
          echo "published: ${published}"
          if [ "${published}" != "${expected}" ] ; then
            echo "::error::${TAG} lists ${published}, expected ${expected}"
            exit 1
          fi

      - name: Pull the published image
        # From the registry and without a platform, which is what a user's
        # docker does: the daemon picks the entry of the manifest list that
        # matches this runner, and an entry that is missing or mislabelled
        # fails here rather than in a test. By digest rather than by tag: this
        # is the image this run pushed, not whatever a master run finishing
        # alongside it has since put under the same name.
        run: docker pull "${{ steps.reponame.outputs.DOCKER_REPO }}@${{ needs.docker.outputs.digest }}"

      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r tests/requirements.txt

      - name: Run the smoke tests
        # Not the whole suite: test.yml already runs that against the image
        # built from this same commit on both of these architectures, so what
        # is left to learn is whether the artefact that was published starts
        # and relays. That is what the smoke tests say (see pytest.ini).
        #
        # No junit here. The reporter in test-results.yml follows the "test"
        # workflow, and this job's own verdict is the signal.
        timeout-minutes: 10
        env:
          POSTFIX_RELAY_IMAGE: "${{ steps.reponame.outputs.DOCKER_REPO }}@${{ needs.docker.outputs.digest }}"
          # This image is the runner's own architecture, which the fixture
          # otherwise refuses for looking like a stale local build.
          POSTFIX_RELAY_IMAGE_PUBLISHED: "1"
          # And it still has to be the architecture this job meant to pull.
          POSTFIX_RELAY_ARCH: "amd64"
        run: pytest -m smoke

  verify_published_arm64:
    name: "Verify Published Image (arm64)"
    # The same run as the one above, on one of github's arm64 runners, so that
    # both entries of the manifest that users pull are answered for. The third,
    # arm/v7, has no runner: emulating it would add half an hour to every push
    # to master to re-check an image test.yml already builds and smoke-tests
    # from this same commit.
    needs: docker
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Helper for custom repo name
        id: reponame
        run: |
          if [ "${DOCKER_REPO}" != "" ]; then
            echo "DOCKER_REPO=${DOCKER_REPO}" >> "${GITHUB_OUTPUT}"
          else
            echo "DOCKER_REPO=${{ github.repository }}" >> "${GITHUB_OUTPUT}"
          fi
        env:
          DOCKER_REPO: "${{ secrets.DOCKER_REPO }}"

      - name: Pull the published image
        run: docker pull "${{ steps.reponame.outputs.DOCKER_REPO }}@${{ needs.docker.outputs.digest }}"

      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r tests/requirements.txt

      - name: Run the smoke tests
        timeout-minutes: 10
        env:
          POSTFIX_RELAY_IMAGE: "${{ steps.reponame.outputs.DOCKER_REPO }}@${{ needs.docker.outputs.digest }}"
          POSTFIX_RELAY_IMAGE_PUBLISHED: "1"
          POSTFIX_RELAY_ARCH: "arm64"
        run: pytest -m smoke

  promote:
    name: "Publish latest"
    # The tag users pull, written only now. Until this job runs, what the build
    # pushed is reachable under its "sha-" tag and its digest and nothing else,
    # so latest still names the last image that got this far. It moves once the
    # image behind that digest has been pulled back from the registry on both
    # runner architectures and has started, reported healthy and relayed a
    # whole message on each -- which is the difference between the suite
    # gating what merges and gating what ships. (issue #272)
    #
    # It cannot make the publication conditional on the whole suite: that runs
    # in test.yml, and a job cannot wait on another workflow. What it does gate
    # on is the four smoke tests, run against the artefact itself rather than a
    # local build of the same tree.
    needs: [docker, verify_published_amd64, verify_published_arm64]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      -
        name: Helper for custom repo name
        id: reponame
        run: |
          if [ "${DOCKER_REPO}" != "" ]; then
            echo "DOCKER_REPO=${DOCKER_REPO}" >> "${GITHUB_OUTPUT}"
          else
            echo "DOCKER_REPO=${{ github.repository }}" >> "${GITHUB_OUTPUT}"
          fi
        env:
          DOCKER_REPO: "${{ secrets.DOCKER_REPO }}"
      -
        name: Check this commit is still master's head
        id: head
        # Master runs are deliberately not cancelled -- see the concurrency
        # block at the top of this file -- so two merges close together give
        # two runs whose promote jobs nothing orders. The older one finishing
        # last would put latest back on the older image, where it would stay
        # until the next push to master. Asking whether this run is still the
        # head is what orders them: the newer run promotes its own image and
        # the older stands down, rather than the last writer winning.
        #
        # Read from the remote rather than from a checkout, which this job has
        # no other use for. The emptiness check is not defensive padding: the
        # pipeline's status is cut's and not ls-remote's, so a failure to reach
        # github arrives as an empty string rather than a non-zero exit, and
        # without it this would read as "superseded" and quietly stop promoting
        # anything ever again -- the one outcome worse than promoting the wrong
        # image. (issue #306)
        run: |
          head=$(git ls-remote "https://github.com/${{ github.repository }}" refs/heads/master | cut -f1)
          if [ -z "${head}" ] ; then
            echo "::error::could not read what master points at"
            exit 1
          fi
          echo "head=${head}" >> "${GITHUB_OUTPUT}"
          if [ "${head}" != "${{ github.sha }}" ] ; then
            echo "::notice::${{ github.sha }} is no longer master's head (${head}); leaving latest to that run"
          fi
      -
        name: Login to DockerHub
        # After the check above, and gated with it: standing down writes
        # nothing, so there is nothing to authenticate for.
        if: steps.head.outputs.head == github.sha
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Point latest at the image that was verified
        if: steps.head.outputs.head == github.sha
        # imagetools copies the manifest list rather than building or pushing
        # anything again: latest ends up on the same digest, with the same three
        # architectures and the same provenance attestations under it. Verified
        # with "--dry-run" against the published image, which returned the index
        # entry for entry.
        run: |
          docker buildx imagetools create -t "${REPO}:latest" "${REPO}@${DIGEST}"
          echo "latest -> ${DIGEST}"
        env:
          REPO: "${{ steps.reponame.outputs.DOCKER_REPO }}"
          DIGEST: "${{ needs.docker.outputs.digest }}"
