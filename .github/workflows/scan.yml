name: scan

on:
  schedule:
    # Daily, and deliberately not on the hour: github queues everything that
    # asked for :00 together, and a job nobody is waiting for should not be in
    # that queue.
    #
    # Daily is the cadence the thing being watched deserves. Debian ships a
    # fix, and this image picks it up when its base tag moves -- dated
    # trixie-*-slim tags land every two to three weeks -- so the window is
    # weeks wide and a daily look is the cheapest thing that notices inside it.
    - cron: '17 6 * * *'
  workflow_dispatch:

# Filing one issue, and -- the first time that issue is opened for a given
# finding -- dispatching ci.yml to fix it. actions: write is for that
# dispatch; nothing here ever pushes a commit or a tag itself.
permissions:
  contents: read
  issues: write
  actions: write

# Two runs must not race to file the same issue. Queue the second rather than
# cancelling the first: the first is the one that would have opened it.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# What this is, and what it deliberately is not.
#
# It scans the image people pull, on a clock, and never reports a check on a
# pull request. That placement is the design rather than a limitation, and
# three things settle it.
#
# ci.yml pushes nothing on a pull request, so a pull request has no published
# image. A scan there would examine an artefact with no users while the one
# with eleven million pulls went unexamined.
#
# A red here would never be attributable to the diff. ci.yml builds only what
# the tree contains, so a pull request touching "run", a fixture or the README
# cannot introduce a Debian CVE -- and its author holds no lever either, since
# the remedy is a base image bump that dependabot.yml deliberately keeps out of
# auto-merge. Every other gate in this tree -- ShellCheck, Pytest, Build Image
# -- fails for something its author caused and can fix.
#
# And lint.yml's header already wrote the rule this follows: "An unpinned
# linter fails somebody's unrelated pull request on the day it ships a new
# check." A vulnerability database is that input by construction, because
# pinning it is the same as not running this at all. So this stays off the pull
# request path; promoting it to a required check means answering that argument
# rather than assuming it.
#
# --ignore-unfixed is what makes a red mean something. Without it this reports
# around 290 findings that Debian has assessed as not warranting a stable
# update and nobody here can close. The largest single group of them, 68 of 287
# rows when this was written, is perl -- in the image only so the
# manually-invoked qshape keeps working, and executed by no relaying container.
# With it, a red says exactly one thing: Debian shipped a fix that the
# published image does not have -- and, since this job now dispatches a rebuild
# and waits for it, that the rebuild did not put that fix on the tag either.
# Green covers two states rather than one: nothing was found, or something was
# found, rebuilt away and verified gone inside this run. Both are states with
# nothing for a person to do, which is what the failure email is for; the issue,
# opened and closed, is the record that the second one happened.
#
# So this is expected to be green, and it was when it was written: trivy and
# grype both reported zero fixable findings, and "apt-get -s full-upgrade"
# inside the published image agreed with them. It is an alarm for a window, not
# a backlog to work through.

jobs:
  trivy:
    name: "Image Scan"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Pinned and checksummed, and nothing bumps it, the way lint.yml installs
      # shellcheck -- and here the reason is not hypothetical. The
      # aquasecurity/trivy-action wrapper was compromised on 2026-03-19, when
      # 76 of its 77 version tags were force-pushed to a credential stealer.
      # Pinning that action by tag would not have helped, and pinning it by
      # commit would tie this to a wrapper breached twice in a month. The job
      # needs no checkout, no buildx and no QEMU, so skipping the dependency
      # costs one curl.
      #
      # A binary that never moves costs this job much less than it costs a
      # linter: the database is fetched fresh on every run and is what carries
      # the signal.
      #
      # sha256 is the one from trivy_0.74.0_checksums.txt for the Linux-64bit
      # tarball.
      TRIVY_VERSION: v0.74.0
      TRIVY_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
      ISSUE_TITLE: "Fixable vulnerabilities in the published image"
      # How many daily scans in a row get to dispatch a no-cache rebuild for
      # the same finding before this stops and leaves the issue for a person.
      # Three gives a rebuild that failed once (a runner hiccup, a registry
      # blip) two more days to clear on its own before anyone has to look.
      MAX_REBUILD_ATTEMPTS: 3
    steps:
      - name: Helper for custom repo name
        # The same resolution ci.yml uses to decide what to push. It has to
        # agree with it: the point is to scan what was published, so the name
        # cannot be written here independently and drift.
        id: reponame
        run: |
          if [ "${DOCKER_REPO}" != "" ]; then
            echo "DOCKER_REPO=${DOCKER_REPO}" >> "${GITHUB_OUTPUT}"
          else
            echo "DOCKER_REPO=${{ github.repository }}" >> "${GITHUB_OUTPUT}"
          fi
        env:
          DOCKER_REPO: "${{ secrets.DOCKER_REPO }}"

      - name: Install trivy
        # Into RUNNER_TEMP. Nothing is checked out in this job at all -- trivy
        # pulls the published manifest itself, so there is no build context to
        # keep it out of.
        run: |
          set -eu
          version="${TRIVY_VERSION#v}"
          url="https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}/trivy_${version}_Linux-64bit.tar.gz"
          curl -fsSL -o "${RUNNER_TEMP}/trivy.tar.gz" "$url"
          echo "${TRIVY_SHA256}  ${RUNNER_TEMP}/trivy.tar.gz" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/trivy"
          tar -xzf "${RUNNER_TEMP}/trivy.tar.gz" -C "${RUNNER_TEMP}/trivy"
          echo "${RUNNER_TEMP}/trivy" >> "${GITHUB_PATH}"

      - name: Scan the published image
        # linux/amd64, which is what the runner is. The three published
        # platforms were measured to carry the same findings: every package the
        # Dockerfile names resolves to the same Debian version on all three,
        # because Debian keeps one source version across release
        # architectures, and the one package that differs -- postsrsd, absent
        # on armhf -- has none. That is an assumption about Debian rather than
        # something this job verifies, so it is written down here.
        #
        # --exit-code 0 is deliberate, and the reason is the next step. Trivy
        # exits non-zero both when it finds something and when it could not do
        # its job, and those must not be confused: an unreachable database
        # filed as a vulnerability would be worse than no scan. So findings are
        # counted out of the report instead, and a non-zero exit from here can
        # only mean trivy failed -- which skips every step below and fails the
        # run, so it is an email rather than a wrong issue.
        id: scan
        run: |
          set -eu
          trivy --version
          trivy image \
            --scanners vuln \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            --format json \
            --output "${RUNNER_TEMP}/trivy.json" \
            --timeout 10m \
            --exit-code 0 \
            "${IMAGE}"
          count=$(jq '[.Results[]?.Vulnerabilities[]?] | length' "${RUNNER_TEMP}/trivy.json")
          echo "count=${count}" >> "${GITHUB_OUTPUT}"
          # Which image this verdict is about, for the re-scan below to compare
          # against. A tag is a moving name and the whole point of the rebuild
          # is to move it, so the count alone does not say whether a later scan
          # looked at a different image or at the same one twice.
          digest=$(jq -r '.Metadata.RepoDigests[0] // empty' "${RUNNER_TEMP}/trivy.json")
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          # And which findings they are, for the step below to tell a finding
          # it has already spent rebuilds on from one it has not.
          ids=$(jq -r '[.Results[]?.Vulnerabilities[]?.VulnerabilityID] | unique | join(",")' \
            "${RUNNER_TEMP}/trivy.json")
          echo "ids=${ids}" >> "${GITHUB_OUTPUT}"
          echo "${count} finding(s) with a fix available in ${digest:-${IMAGE}}"
          trivy convert --format table "${RUNNER_TEMP}/trivy.json" \
            | tee "${RUNNER_TEMP}/trivy.txt"
        env:
          IMAGE: "${{ steps.reponame.outputs.DOCKER_REPO }}:latest"

      - name: Open or retry the finding issue
        # One issue, held open for as long as the finding stands -- a daily
        # cron that commented every morning would teach everyone to filter
        # it, so a run that already gave up says nothing further either.
        # Between those two is a retry: "rebuild-attempts=<n>" at the end of
        # the issue body is the only state this job has anywhere to keep
        # between runs (nothing here checks the repo out, and a label needs
        # to already exist to be set), and it is what the next step and this
        # one both read to decide whether today is a dispatch or a give-up.
        id: issue
        if: steps.scan.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job checks nothing out, on purpose -- trivy pulls the
          # published manifest itself. gh resolves the repository it acts on
          # from --repo, then GH_REPO, then the git remotes of the working
          # directory; with no checkout there are none, so without this it
          # exits "failed to run git: fatal: not a git repository" before it
          # ever reaches the API.
          GH_REPO: ${{ github.repository }}
          IMAGE: "${{ steps.reponame.outputs.DOCKER_REPO }}:latest"
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          IDS: "${{ steps.scan.outputs.ids }}"
        run: |
          set -eu
          # Matched on the title rather than through the search index, which
          # lags by enough that a daily job would file a second one.
          existing=$(gh issue list --state open --limit 100 --json number,title \
            --jq '[.[] | select(.title == env.ISSUE_TITLE) | .number] | first // empty')

          if [ -z "$existing" ] ; then
            {
              echo "\`trivy image --ignore-unfixed --severity HIGH,CRITICAL\` found"
              echo "vulnerabilities in \`${IMAGE}\` that Debian has already shipped a fix for."
              echo
              echo "The remedy is a build that re-resolves the packages, and this run has"
              echo "already dispatched the **ci** workflow on \`master\` with"
              echo "**Rebuild without the layer cache** ticked to do it (attempt 1 of"
              echo "${MAX_REBUILD_ATTEMPTS}) -- see the Actions tab for its progress. That"
              echo "same run waits for the rebuild, re-scans what it published and closes"
              echo "this issue itself if the finding is gone. If the archive did not have"
              echo "the fix yet, or that rebuild failed, tomorrow's scan"
              echo "retries on its own, up to ${MAX_REBUILD_ATTEMPTS} attempts total; after"
              echo "that it stops and leaves this issue open rather than trying forever. The"
              echo "manual remedy still applies at any point: merge the pending base image"
              echo "bump if there is one, or run **ci** again from the Actions tab with the"
              echo "same option."
              echo
              echo "This issue is closed automatically once the scan comes back clean."
              echo
              echo "[Scan run](${RUN_URL})"
              echo
              echo '```'
              head -c 50000 "${RUNNER_TEMP}/trivy.txt"
              echo '```'
              echo
              echo "<!-- rebuild-attempts=1 seen=${IDS} -->"
            } > "${RUNNER_TEMP}/issue.md"
            gh issue create --title "${ISSUE_TITLE}" --body-file "${RUNNER_TEMP}/issue.md"
            echo "dispatch=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Missing the marker entirely would mean an open issue with this
          # exact title that this job did not write -- not reachable through
          # its own create, but true of every issue this retry logic was
          # merged onto and found already open, marker-less. Read as attempt
          # 0 rather than failing, so it is still picked up on the next scan
          # instead of never again.
          body=$(gh issue view "$existing" --json body --jq .body)
          attempts=$(printf '%s' "$body" | grep -oP 'rebuild-attempts=\K[0-9]+' | tail -1)
          attempts=${attempts:-0}
          seen=$(printf '%s' "$body" | grep -oP 'rebuild-attempts=[0-9]+ seen=\K[^ ]+' | tail -1)
          seen=${seen:-}

          # The count is about how many rebuilds failed to clear a particular
          # finding, and this issue is matched on its title alone -- there is
          # one of it, held open until the scan is clean about *everything*.
          # So a vulnerability that turns up while the issue is open used to
          # inherit whatever budget the previous one had already spent, and a
          # brand-new one arriving on day three reached the give-up branch
          # having never had a single rebuild attempted for it. Recording the
          # ids the attempts were spent on is what tells those apart: an id
          # this issue has not been retried for before restarts the budget,
          # which is what invariant 36 says the counter does and what it did
          # not do. Ids only accumulate, so a finding that is fixed and comes
          # back does not hand out a second budget, and the cron still paces
          # the whole thing at one rebuild a day however many arrive.
          #
          # An older marker carries no ids at all, which reads as every
          # current finding being unseen and restarts the budget once. That
          # is the honest answer rather than a migration bug: what those
          # attempts were spent on is not recorded anywhere, so the only
          # thing that can be said about today's findings is that nothing
          # says they were covered. It costs one extra attempt, once, on an
          # issue that is already open.
          fresh=""
          for id in $(printf '%s' "${IDS}" | tr ',' ' ') ; do
            case ",${seen}," in
              *",${id},"*) ;;
              *) fresh="$id" ; break ;;
            esac
          done
          if [ -n "$fresh" ] ; then
            echo "Issue #${existing}: ${fresh} is not one of the findings earlier attempts were spent on; restarting the budget."
            attempts=0
          fi
          seen=$(printf '%s,%s' "${seen}" "${IDS}" | tr ',' '\n' \
            | grep -v '^$' | sort -u | paste -sd,)

          # sed only edits a marker that is there to find: on a body with none
          # -- the same pre-existing-issue case the read above defaults for --
          # substituting is a silent no-op, which is what left the very first
          # issue this shipped against retrying attempt 1 forever, never
          # actually written down. Appending one is the other half that read
          # already assumed.
          # The whole marker is rewritten rather than just the number, since
          # the ids travel with it -- and "[^>]*" is what carries an older
          # marker that has only the number across to the new shape.
          stampAttempts() {
            if printf '%s' "$body" | grep -qP 'rebuild-attempts=[0-9]+' ; then
              printf '%s' "$body" \
                | sed -E "s|<!-- rebuild-attempts=[0-9]+[^>]*-->|<!-- rebuild-attempts=$1 seen=${seen} -->|"
            else
              printf '%s\n\n<!-- rebuild-attempts=%s seen=%s -->\n' "$body" "$1" "${seen}"
            fi
          }

          if [ "$attempts" -lt "$MAX_REBUILD_ATTEMPTS" ] ; then
            next=$((attempts + 1))
            stampAttempts "$next" > "${RUNNER_TEMP}/issue.md"
            gh issue edit "$existing" --body-file "${RUNNER_TEMP}/issue.md"
            gh issue comment "$existing" --body \
              "Still finding this. Dispatched another no-cache rebuild (attempt ${next} of ${MAX_REBUILD_ATTEMPTS}); this run waits for it and closes this issue if it clears the finding. [Scan run](${RUN_URL})"
            echo "Issue #${existing}: dispatching rebuild attempt ${next} of ${MAX_REBUILD_ATTEMPTS}."
            echo "dispatch=true" >> "${GITHUB_OUTPUT}"
          elif [ "$attempts" -eq "$MAX_REBUILD_ATTEMPTS" ] ; then
            # The attempt that reaches the cap is the one that gets to say so
            # -- the counter is bumped past it here too, so tomorrow's run
            # lands in the silent branch below instead of repeating this
            # comment every day the issue stays open.
            next=$((attempts + 1))
            stampAttempts "$next" > "${RUNNER_TEMP}/issue.md"
            gh issue edit "$existing" --body-file "${RUNNER_TEMP}/issue.md"
            gh issue comment "$existing" --body \
              "${MAX_REBUILD_ATTEMPTS} automatic rebuilds have not cleared this. Giving up on further attempts -- this needs a manual look: merge the pending base image bump if there is one, or run **ci** from the Actions tab with **Rebuild without the layer cache** ticked. [Scan run](${RUN_URL})"
            echo "Issue #${existing}: ${MAX_REBUILD_ATTEMPTS} attempts made, giving up automatic retries."
            echo "dispatch=false" >> "${GITHUB_OUTPUT}"
          else
            echo "Issue #${existing}: already gave up automatic retries, leaving it alone."
            echo "dispatch=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Trigger a no-cache rebuild and wait for it
        # The remedy the issue above names, done here instead of waiting for
        # someone to tick the box by hand: ci.yml's apt install reads the
        # archive fresh, but cache-from/cache-to make that layer a cache hit
        # until the base image tag moves, so a finding otherwise sits until
        # the next trixie-<date>-slim bump. Dispatching it from the same run
        # that opens or retries the issue closes that gap in minutes rather
        # than weeks.
        #
        # Gated on "dispatch", not on the finding count alone -- the count
        # stays non-zero for as long as the issue is open, including the runs
        # that decided not to retry any more, and re-dispatching a
        # three-architecture build on every one of those would be the
        # daily-comment mistake the step above already avoids, spent on
        # compute instead of noise.
        #
        # And then it waits, which is why this step is no longer one line.
        # Dispatching and returning left the remedy automatic and the
        # verification manual: nothing starts this workflow except its own
        # cron, ci.yml holds no "issues" permission and touches the tracker
        # nowhere, and the close step below reads the count from the scan this
        # run already did -- so the issue a finding opens can only be closed by
        # a *later* run of this workflow, and the only thing that starts one is
        # tomorrow's cron. Measured on issue #381: the rebuild this step
        # dispatched at 11:26 published a fixed image at 11:33, and the issue
        # and the red run stayed as they were for the rest of the day.
        # Waiting here is what lets the step below ask whether the remedy
        # worked, on the run that applied it.
        #
        # A step, deliberately, and not a second trigger on this workflow.
        # The daily pacing the attempt counter rests on lives in the trigger
        # list rather than in the counter -- nothing compares days, it bumps
        # once per run that finds the issue open -- so a "workflow_run"
        # listener on ci would turn a three-day budget into a three-event
        # one. ci.yml runs on a push to every branch and on every pull
        # request, so an unrelated branch push during an open finding would
        # spend an attempt, and spend it by dispatching a no-cache master
        # build that moves the latest tag. Chaining this workflow to its own
        # rebuild also spends all three attempts inside twenty minutes,
        # against one archive snapshot, which is the one thing the retry
        # exists to sample more than once.
        id: rebuild
        if: steps.issue.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu

          # "gh workflow run" prints nothing identifying the run it starts, and
          # the API offers no handle for it either, so it has to be recognised
          # afterwards. Run ids increase, so the newest ci run that already
          # exists is a floor and the oldest one above it is this one's.
          # Narrowing to workflow_dispatch on master is what keeps an unrelated
          # push build, whose id would also be higher, from being taken for it.
          # Two floors, not one. The id floor alone is the obvious version and
          # it has a hole: a listing that comes back empty -- no prior dispatch
          # at all on a fresh fork of this workflow, or one transient API
          # failure -- reads as 0, and "min" then picks the OLDEST run in the
          # window instead of the newest. That run finished days ago with
          # conclusion "success" over the image this scan just found something
          # in, so the wait returns at once and the re-scan is handed a tag
          # that never moved. A created-at floor cannot be fooled that way, and
          # two minutes of slack is for the clock rather than for the search.
          floor=$(gh run list --workflow ci.yml --branch master \
            --event workflow_dispatch --limit 1 \
            --json databaseId --jq '.[0].databaseId // 0' || echo 0)
          since=$(date -u -d '-2 minutes' +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run ci.yml --ref master -f no-cache=true

          # The dispatch is asynchronous: the run does not exist yet when the
          # command above returns.
          run=""
          for _ in $(seq 1 24) ; do
            run=$(gh run list --workflow ci.yml --branch master \
              --event workflow_dispatch --limit 20 --json databaseId,createdAt \
              | jq -r --argjson floor "${floor}" --arg since "${since}" \
                  '[.[] | select(.databaseId > $floor and .createdAt >= $since)
                        | .databaseId] | min // empty')
            if [ -n "$run" ] ; then
              break
            fi
            sleep 5
          done
          if [ -z "$run" ] ; then
            echo "Dispatched, but no new ci run appeared within two minutes."
            echo "conclusion=missing" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "run_id=${run}" >> "${GITHUB_OUTPUT}"
          echo "Waiting for ${GITHUB_SERVER_URL}/${GH_REPO}/actions/runs/${run}"

          # Bounded, and deliberately well inside this job's own timeout: a
          # rebuild that never finishes has to degrade to what this job did
          # before -- issue open, run red, tomorrow's scan tries again --
          # rather than have a cancelled job take the steps below down with it.
          # A three-architecture build takes six to eight minutes; twenty-five
          # is room for a queue, not for a hang. A "gh run view" that fails
          # transiently is not a verdict, so it reads as "not finished yet" and
          # the deadline is what ends the wait either way.
          # Thirty-five minutes. A three-architecture rebuild measured six and a
          # half before the verify jobs began running the whole suite on one
          # and about a quarter of an hour after, and ci.yml's own bounds allow
          # it considerably more than that; this is room for a queue -- the
          # dispatched run shares a concurrency group with the push run for the
          # same commit, so it can sit behind one -- and not room for a hang.
          # It has to stay well inside the job's own timeout, because a job
          # killed by that is *cancelled* rather than failed, which sends no
          # notification and reaches no verdict: the one way out of here that
          # would turn the alarm off instead of leaving it red.
          #
          # A failed poll is not a verdict, so it reads as "not finished yet".
          # A run of them is a different thing from a queue, though, and
          # counting them is what keeps a revoked token or a 403 on the actions
          # scope from spinning silently for the whole bound and then reporting
          # it as a slow rebuild.
          deadline=$(( SECONDS + 35 * 60 ))
          status=""
          conclusion=""
          unreadable=0
          while [ "${SECONDS}" -lt "${deadline}" ] ; do
            if ! status=$(gh run view "$run" --json status --jq .status) ; then
              unreadable=$((unreadable + 1))
              if [ "$unreadable" -ge 5 ] ; then
                echo "gh could not read run ${run} five polls running."
                echo "conclusion=unreadable" >> "${GITHUB_OUTPUT}"
                exit 0
              fi
              status=""
              sleep 20
              continue
            fi
            unreadable=0
            if [ "$status" = "completed" ] ; then
              conclusion=$(gh run view "$run" --json conclusion --jq .conclusion || echo "")
              break
            fi
            sleep 20
          done

          if [ "$status" != "completed" ] ; then
            echo "ci run ${run} was still '${status:-unknown}' when the wait ran out; not re-scanning."
            echo "conclusion=timeout" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "ci run ${run} finished: ${conclusion}"
          echo "conclusion=${conclusion}" >> "${GITHUB_OUTPUT}"

      - name: Re-scan what the rebuild published
        # The question the run that applied a remedy is in the best position to
        # answer, and the one nothing used to ask: did it work? Same command as
        # the first scan, against the same tag, which now resolves to whatever
        # ci.yml's "Publish latest" moved it to.
        #
        # Written out again rather than shared with the first scan because this
        # job checks nothing out on purpose, so there is no script in the
        # workspace to call twice -- and because the two differ: the table the
        # first one renders is what the issue body quotes, and this one only
        # has to reach a count.
        #
        # The digest comparison is not decoration. ci.yml's "Publish latest"
        # stands down *without failing* when master's head moved under it, and
        # the run conclusion is "success" either way; a build can also succeed
        # having published nothing this tag would see. In both cases latest
        # still resolves to the image that was just scanned, the count comes
        # back unchanged, and reporting that as "the rebuild did not fix it"
        # would be a claim about a rebuild that never reached the tag. The
        # digests are what tell those apart from a remedy that genuinely
        # failed. The first scan's digest can only be empty if trivy stopped
        # reporting one, so an empty one compares equal to nothing and the
        # count is used on its own.
        #
        # The verdict it hands on is a word and that is load-bearing, not
        # style. A step that did not run contributes no outputs at all, so
        # every reference to one of them is Null rather than the empty string
        # it reads as -- and github's comparison operators coerce a mismatched
        # pair to numbers, where Null is 0 and the string "0" is also 0. So
        # "steps.rescan.outputs.count == '0'" is *true* on every path where
        # this step was skipped or bailed out: a rebuild that failed, was
        # cancelled, never appeared, outlasted the wait, or published nothing
        # the tag points at. Gated on that, the two steps below would have
        # closed a live vulnerability issue with "no longer has a
        # vulnerability with a fix available" and gone green, over exactly the
        # cases this step exists to catch. "clean" parses as NaN and NaN
        # equals nothing, including itself, so a word cannot do that.
        id: rescan
        if: steps.rebuild.outputs.conclusion == 'success'
        env:
          IMAGE: "${{ steps.reponame.outputs.DOCKER_REPO }}:latest"
          BEFORE: "${{ steps.scan.outputs.digest }}"
        run: |
          set -eu
          trivy image \
            --scanners vuln \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            --format json \
            --output "${RUNNER_TEMP}/rescan.json" \
            --timeout 10m \
            --exit-code 0 \
            "${IMAGE}"
          after=$(jq -r '.Metadata.RepoDigests[0] // empty' "${RUNNER_TEMP}/rescan.json")
          if [ -n "$BEFORE" ] && [ "$after" = "$BEFORE" ] ; then
            echo "${IMAGE} still resolves to ${after}: the rebuild published nothing new."
            exit 0
          fi
          count=$(jq '[.Results[]?.Vulnerabilities[]?] | length' "${RUNNER_TEMP}/rescan.json")
          echo "count=${count}" >> "${GITHUB_OUTPUT}"
          echo "digest=${after}" >> "${GITHUB_OUTPUT}"
          if [ "${count}" -eq 0 ] ; then
            echo "verdict=clean" >> "${GITHUB_OUTPUT}"
          else
            echo "verdict=dirty" >> "${GITHUB_OUTPUT}"
          fi
          echo "${count} finding(s) with a fix available in ${after}"
          trivy convert --format table "${RUNNER_TEMP}/rescan.json"

      - name: Close the finding issue
        # A scan came back clean, so whatever this job filed earlier is
        # answered -- either the one at the top of this run, or the one after
        # the rebuild, which is the same verdict about a newer image.
        if: steps.scan.outputs.count == '0' || steps.rescan.outputs.verdict == 'clean'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job checks nothing out, on purpose -- trivy pulls the
          # published manifest itself. gh resolves the repository it acts on
          # from --repo, then GH_REPO, then the git remotes of the working
          # directory; with no checkout there are none, so without this it
          # exits "failed to run git: fatal: not a git repository" before it
          # ever reaches the API.
          GH_REPO: ${{ github.repository }}
          IMAGE: "${{ steps.reponame.outputs.DOCKER_REPO }}:latest"
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          CI_RUN: "${{ steps.rebuild.outputs.run_id }}"
          RESCAN_DIGEST: "${{ steps.rescan.outputs.digest }}"
        run: |
          set -eu
          existing=$(gh issue list --state open --limit 100 --json number,title \
            --jq '[.[] | select(.title == env.ISSUE_TITLE) | .number] | first // empty')
          if [ -z "$existing" ] ; then
            echo "Nothing open, nothing to close."
            exit 0
          fi
          # Which of the two scans answered it is the thing a reader wants
          # from this comment: a clean first scan means the finding went away
          # on its own, and a clean re-scan means this run's rebuild is what
          # took it away. Same verdict, different story.
          if [ -n "${CI_RUN}" ] && [ -n "${RESCAN_DIGEST}" ] ; then
            note="This run dispatched a no-cache rebuild ([ci run](${GITHUB_SERVER_URL}/${GH_REPO}/actions/runs/${CI_RUN})) and waited for it; \`${IMAGE}\` has since moved to \`${RESCAN_DIGEST}\`, which scans clean. Whether that digest is the one this rebuild produced is not something this job can tell -- another master run finishing alongside it publishes the same way. "
          else
            note=""
          fi
          gh issue close "$existing" --comment \
            "\`${IMAGE}\` no longer has a vulnerability with a fix available. ${note}[Scan run](${RUN_URL})"

      - name: Fail the run
        # Last, so the issue is filed before the job goes red. The email github
        # sends for a failed scheduled run is the immediate signal; the issue
        # is the one that is still there next week.
        #
        # A clean re-scan spares it, and that is the point rather than a
        # softened alarm: the email exists to fetch a person, and this run
        # already applied the remedy, watched it land and closed the issue it
        # filed. A red run nobody needs to act on is the "teach everyone to
        # filter it" failure the step above avoids for comments, spent on
        # attention instead. The record is the issue, opened and closed. Every
        # other way out of the rebuild -- failed, cancelled, never appeared,
        # still timing out, or a latest that never moved -- leaves the re-scan
        # count empty and lands here, red, exactly as before -- and reaches
        # that through a word rather than a number, for the reason the re-scan
        # step sets one out.
        if: steps.scan.outputs.count != '0' && steps.rescan.outputs.verdict != 'clean'
        env:
          COUNT: "${{ steps.scan.outputs.count }}"
          RESCAN: "${{ steps.rescan.outputs.verdict }}"
          REBUILD: "${{ steps.rebuild.outputs.conclusion }}"
        run: |
          echo "${COUNT} finding(s) with a fix available."
          echo "rebuild: ${REBUILD:-not dispatched}; re-scan: ${RESCAN:-did not reach a verdict}"
          exit 1
